service: serverless-loan-orchestrator
frameworkVersion: "4"

plugins:
    - serverless-step-functions
    - serverless-localstack
    # Permite definir iamRoleStatements por función en lugar de un rol global compartido.
    # Principio de mínimo privilegio: cada Lambda solo accede a los recursos que necesita.
    - serverless-iam-roles-per-function

provider:
    name: aws
    runtime: nodejs20.x
    region: us-east-1
    stage: ${opt:stage, 'dev'}
    environment:
        STAGE: ${self:provider.stage}
        LOAN_TABLE_NAME: ${self:custom.loanTableName}
        LOAN_STATE_MACHINE_ARN: arn:aws:states:${self:provider.region}:${self:custom.resolvedAccountId}:stateMachine:${self:custom.stateMachineName}
        DISBURSEMENT_QUEUE_URL:
            Ref: DisbursementQueue

build:
    esbuild:
        bundle: true
        minify: false
        sourcemap: true
        target: node20
        # AWS SDK v3 viene preinstalado en el runtime de Lambda Node.js 20.
        # Excluirlo del bundle reduce el tamaño del artefacto significativamente.
        external:
            - "@aws-sdk/*"

custom:
    loanTableName: ${self:service}-loan-table-${self:provider.stage}
    stateMachineName: ${self:service}-loan-orchestrator-${self:provider.stage}
    disbursementQueueName: ${self:service}-disbursement-${self:provider.stage}
    # En LocalStack el account ID es siempre 000000000000.
    # En AWS real se usa la variable de entorno AWS_ACCOUNT_ID.
    resolvedAccountId: ${env:AWS_ACCOUNT_ID, "000000000000"}
    localstack:
        stages:
            - local
        host: http://localhost
        edgePort: 4566
        autostart: false
        lambda:
            mountCode: false
        docker:
            sudo: false

functions:
    formHandler: ${file(src/handlers/step-functions/form/serverless.function.yml)}
    getLoanStatus: ${file(src/handlers/http/loans/get-status/serverless.function.yml)}
    bankAuthHandler: ${file(src/handlers/step-functions/bank-auth/serverless.function.yml)}
    userRiskHandler: ${file(src/handlers/step-functions/user-risk/serverless.function.yml)}
    firmHandler: ${file(src/handlers/step-functions/firm/serverless.function.yml)}
    fundingJobProducer: ${file(src/handlers/step-functions/funding/serverless.function.yml):fundingJobProducer}
    fundingHandler: ${file(src/handlers/step-functions/funding/serverless.function.yml):fundingHandler}

# La definición de la State Machine vive en resources/step-functions.yml
# para mantener este archivo legible y los comentarios de arquitectura
# co-ubicados con la definición de los estados.
stepFunctions:
    stateMachines:
        ${file(resources/step-functions.yml)}

resources:
    - ${file(resources/dynamo-table.yml)}
    - ${file(resources/sqs-queues.yml)}
