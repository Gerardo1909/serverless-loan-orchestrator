fundingJobProducer:
    handler: src/handlers/step-functions/funding/funding-job-producer.handler.handler
    description: Enqueues disbursement job to SQS
    iamRoleStatements:
        - Effect: Allow
          Action:
              - sqs:SendMessage
          Resource:
              Fn::GetAtt: [DisbursementQueue, Arn]

fundingHandler:
    handler: src/handlers/step-functions/funding/funding.handler.handler
    description: Processes loan disbursement from SQS
    iamRoleStatements:
        - Effect: Allow
          Action:
              - dynamodb:UpdateItem
          Resource:
              Fn::GetAtt: [LoanTable, Arn]
        - Effect: Allow
          Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
          Resource:
              Fn::GetAtt: [DisbursementQueue, Arn]
    events:
        - sqs:
              arn:
                  Fn::GetAtt: [DisbursementQueue, Arn]
              batchSize: 1
              functionResponseType: ReportBatchItemFailures
