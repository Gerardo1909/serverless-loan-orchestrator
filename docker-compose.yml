services:
    localstack:
        image: localstack/localstack:3
        ports:
            - "4566:4566"
        environment:
            - DEBUG=0
            - DOCKER_HOST=unix:///var/run/docker.sock
            - LAMBDA_EXECUTOR=docker
        volumes:
            - localstack-data:/var/lib/localstack
            - /var/run/docker.sock:/var/run/docker.sock
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "-f",
                    "http://localhost:4566/_localstack/health",
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

volumes:
    localstack-data:
